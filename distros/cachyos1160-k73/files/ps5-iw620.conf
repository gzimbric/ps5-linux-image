# udev would load moal through its PCI alias before /boot/efi is mounted and
# before ps5-iw620-firmware.service has installed the firmware, and that probe
# fails. The blacklist only stops the alias load; the service loads moal by
# name once the firmware is in place.
blacklist moal
softdep moal pre: cfg80211 mlan
options moal fw_name=nxp/pcieuartiw620_combo_v1.bin pcie_int_mode=1 drv_mode=1 cfg80211_wext=4 sta_name=mlan ext_scan=1 auto_fw_reload=0 wifi_reset_config=0 sched_scan=0 ps_mode=2 auto_ds=2 amsdu_disable=1 drvdbg=0x7
