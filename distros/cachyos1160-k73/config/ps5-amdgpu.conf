# PS5 display stability. Keep DPM and GPU recovery disabled, but do not force
# 1080p: the v1.8.5 HDMI stack capability-gates 4K120 and falls back itself if
# the FRL link does not come up. Keep the Pro on Cyan firmware by default;
# Viola has no post-header initialization fallback yet (rmux review, PR #58).
options amdgpu dpm=0 gpu_recovery=0 ps5_viola_fw=0
