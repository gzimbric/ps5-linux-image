name: CachyOS 7.3 11.60 image
run-name: CachyOS 7.3 11.60 image (${{ github.ref_name }})

# Builds the CachyOS image on Linux 7.3.0 for PS5 firmware 11.60 on
# GitHub-hosted x86_64 runners, in two jobs:
#
#   kernel  Linux v7.3 with rmux's pinned 7.3 port plus the Pro-only GPU
#           follow-up, in-tree MT7921/MT7925 PCI support, the IW620 Wi-Fi
#           modules for that kernel, and the linux-ps5 package.
#   image   The official ps5-cachyos image with that kernel and the
#           distros/cachyos1160-k73 profile, checked again read-only after the
#           free blocks are zeroed, compressed to one .img.xz and attached to
#           a draft release.
#
# Nothing is public until the draft is reviewed and published by hand. The
# image is one .img.xz, never split; if it comes out at 2 GiB or more the job
# fails before the release step. Release assets are used rather than workflow
# artifacts because artifacts need a GitHub login and expire. If creating the
# draft fails, the release files are kept as a workflow artifact for 7 days,
# so the draft can be made by hand without building again.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the draft release (created when the draft is published). Default: cachyos1160-k73-build-<run number>'
        type: string
        default: ''
      base_url:
        description: 'Download the official ps5-cachyos.img.xz from this URL instead of the upstream default. It must still match the pinned SHA-256.'
        type: string
        default: ''
      patches_repo:
        description: 'Fetch the 7.3 patch set from this git URL (a mirror) instead of rmuxnet/ps5-linux-patches-1. It must still have the pinned commit, and the files are still checked by SHA-256.'
        type: string
        default: ''
      kernel_run_id:
        description: 'Optional successful kernel job run ID to reuse. Its source inputs and downloaded bundle are verified before use.'
        type: string
        default: ''
  push:
    # Prime the exact kernel-bundle cache on the default branch whenever one
    # of its inputs changes. The image job below is skipped for these pushes.
    branches:
      - main
    paths:
      - '.github/workflows/cachyos1160-k73-image.yml'
      - '.dockerignore'
      - 'scripts/build-linux-ps5-k73.sh'
      - 'scripts/package-linux-ps5-k73.sh'
      - 'docker/kernel-builder/Dockerfile'
      - 'docker/kernel-builder/build.sh'
      - 'docker/kernel-builder/build-k73.sh'
      - 'docker/kernel-builder/build-iw620-k73.sh'
      - 'docker/kernel-builder/package-deb.sh'
      - 'docker/kernel-builder/repro-date'
      - 'distros/cachyos1160-k73/kernel/**'
      - 'distros/cachyos1160-k73/files/ps5-1160-check-boot-files'
permissions:
  actions: read
  contents: read

concurrency:
  group: cachyos1160-k73-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  KERNEL_DIR: linux-bin/cachyos1160-k73
  PACKAGE: linux-ps5-7.3.0-5-x86_64.pkg.tar.zst

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The kernel tree, the Docker builder and the staged modules and headers.
      MIN_FREE_GB: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Hash Git objects rather than workspace mtimes. A tree object covers
      # every name, mode (including symlinks) and blob below that directory.
      - name: Fingerprint exact kernel inputs
        id: kernel-inputs
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/kernel-inputs.txt"
          : > "$inputs"
          for input_path in \
            .dockerignore \
            scripts/build-linux-ps5-k73.sh \
            scripts/package-linux-ps5-k73.sh \
            docker/kernel-builder/Dockerfile \
            docker/kernel-builder/build.sh \
            docker/kernel-builder/build-k73.sh \
            docker/kernel-builder/build-iw620-k73.sh \
            docker/kernel-builder/package-deb.sh \
            docker/kernel-builder/repro-date \
            distros/cachyos1160-k73/kernel \
            distros/cachyos1160-k73/files/ps5-1160-check-boot-files; do
            printf '%s %s\n' "$input_path" "$(git rev-parse "HEAD:$input_path")" >> "$inputs"
          done
          cat "$inputs"
          fingerprint=$(sha256sum "$inputs" | cut -d' ' -f1)
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "key=linux-ps5-k73-bundle-v1-${RUNNER_OS}-${RUNNER_ARCH}-${PACKAGE}-${fingerprint}" \
            >> "$GITHUB_OUTPUT"

      # This cache contains only the 70 MiB compressed handoff used by the
      # image job, not the multi-gigabyte staging tree. There are deliberately
      # no restore keys: a bundle made from any other input set is a miss.
      # Main-branch runs prime the cache so later release-tag runs can restore
      # it under GitHub's cache scoping rules.
      - name: Restore exact kernel bundle
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.KERNEL_DIR }}/${{ env.PACKAGE }}
            ${{ env.KERNEL_DIR }}/${{ env.PACKAGE }}.sha256
            ${{ env.KERNEL_DIR }}/kernel/
            ${{ env.KERNEL_DIR }}/ps5-iw620/
            ${{ env.KERNEL_DIR }}/kernel-cache-manifest.sha256
          key: ${{ steps.kernel-inputs.outputs.key }}

      - name: Check reused kernel run
        id: reused-kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id != ''
        uses: actions/github-script@v8
        env:
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
        with:
          script: |
            const text = process.env.KERNEL_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(text)) {
              core.setFailed(`invalid kernel_run_id: ${text}`);
              return;
            }
            const runId = Number(text);
            if (!Number.isSafeInteger(runId)) {
              core.setFailed(`kernel_run_id is outside the safe integer range: ${text}`);
              return;
            }
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: runId,
            });
            if (run.path !== '.github/workflows/cachyos1160-k73-image.yml' ||
                run.event !== 'workflow_dispatch' || run.status !== 'completed') {
              core.setFailed(`run ${runId} is not a completed manual run of this workflow`);
              return;
            }
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const kernel = jobs.find(job => job.name === 'kernel');
            if (!kernel || kernel.conclusion !== 'success') {
              core.setFailed(`run ${runId} has no successful kernel job`);
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 },
            );
            const matches = artifacts.filter(
              artifact => artifact.name === 'linux-ps5-k73' && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.setFailed(`run ${runId} has ${matches.length} usable linux-ps5-k73 artifacts`);
              return;
            }
            core.setOutput('head_sha', run.head_sha);
            core.notice(`Reusing kernel artifact ${matches[0].id} from run ${runId} at ${run.head_sha}`);

      - name: Match reused kernel inputs
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id != ''
        env:
          DONOR_SHA: ${{ steps.reused-kernel.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$DONOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$DONOR_SHA"
          donor_inputs="$RUNNER_TEMP/kernel-inputs-donor.txt"
          : > "$donor_inputs"
          while read -r input_path _; do
            donor_object=$(git rev-parse "$DONOR_SHA:$input_path")
            printf '%s %s\n' "$input_path" "$donor_object" >> "$donor_inputs"
          done < "$RUNNER_TEMP/kernel-inputs.txt"
          diff -u "$RUNNER_TEMP/kernel-inputs.txt" "$donor_inputs"

      - name: Download reused kernel bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id != ''
        uses: actions/download-artifact@v6
        with:
          name: linux-ps5-k73
          path: ${{ env.KERNEL_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.kernel_run_id }}

      - name: Check disk space
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id == ''
        run: |
          set -euo pipefail
          free_gb() { df -B1G --output=avail / | tail -n1 | tr -d ' '; }
          df -h /
          echo "CPUs: $(nproc)"; free -h
          if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
            echo "Removing preinstalled toolchains to make room"
            sudo rm -rf \
              /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
              /usr/local/share/powershell /usr/local/share/chromium \
              /usr/lib/jvm /opt/microsoft /opt/google /opt/az
            docker system prune --all --force >/dev/null
            df -h /
          fi
          if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
            echo "::error::only $(free_gb) GB free on /, need $MIN_FREE_GB GB"
            exit 1
          fi

      - name: Install packaging tools
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id == ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools zstd

      - name: Build kernel and Wi-Fi modules
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id == ''
        env:
          PATCHES_REPO_INPUT: ${{ inputs.patches_repo }}
        run: |
          set -euo pipefail
          patches_args=()
          if [ -n "${PATCHES_REPO_INPUT:-}" ]; then
            patches_args=(--patches-repo "$PATCHES_REPO_INPUT")
          fi
          ./scripts/build-linux-ps5-k73.sh --out "$KERNEL_DIR" "${patches_args[@]}"

      - name: Package linux-ps5
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id == ''
        run: sudo ./scripts/package-linux-ps5-k73.sh --kernel-dir "$KERNEL_DIR"

      - name: Record kernel bundle manifest
        if: steps.kernel-cache.outputs.cache-hit != 'true' && inputs.kernel_run_id == ''
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          unexpected=$(find "$PACKAGE" "$PACKAGE.sha256" kernel ps5-iw620 \
            ! -type d ! -type f -print)
          if [ -n "$unexpected" ]; then
            echo "::error::kernel bundle has a symlink or special file"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          find "$PACKAGE" "$PACKAGE.sha256" kernel ps5-iw620 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > kernel-cache-manifest.sha256

      - name: Check kernel outputs
        run: |
          set -euo pipefail
          test -s "$KERNEL_DIR/kernel-cache-manifest.sha256"
          (
            cd "$KERNEL_DIR"
            unexpected=$(find "$PACKAGE" "$PACKAGE.sha256" kernel ps5-iw620 \
              kernel-cache-manifest.sha256 ! -type d ! -type f -print)
            if [ -n "$unexpected" ]; then
              echo "::error::kernel bundle has a symlink or special file"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            sha256sum -c kernel-cache-manifest.sha256
          )
          ./distros/cachyos1160-k73/files/ps5-1160-check-boot-files "$KERNEL_DIR/kernel/bzImage"
          (cd "$KERNEL_DIR" && sha256sum -c "$PACKAGE.sha256" && cd ps5-iw620 && sha256sum -c SHA256SUMS)
          grep -q 'ps5-pro-amdgpu.patch sha256' "$KERNEL_DIR/kernel/kernel-build-info.txt"
          {
            echo '```'
            cat "$KERNEL_DIR/kernel/kernel-build-info.txt"
            echo
            echo "IW620 modules:"
            cat "$KERNEL_DIR/ps5-iw620/SHA256SUMS"
            echo
            cat "$KERNEL_DIR/$PACKAGE.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: linux-ps5-k73
          path: |
            ${{ env.KERNEL_DIR }}/${{ env.PACKAGE }}
            ${{ env.KERNEL_DIR }}/${{ env.PACKAGE }}.sha256
            ${{ env.KERNEL_DIR }}/kernel/
            ${{ env.KERNEL_DIR }}/ps5-iw620/
            ${{ env.KERNEL_DIR }}/kernel-cache-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  image:
    needs: kernel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      IMAGE: output/ps5-cachyos1160-k73.img
      OUT: output
      DIST: dist
      # Leave room for the base download, the raw image and the compressed
      # image.
      MIN_FREE_GB: 30
      # xz otherwise applies its roughly 4 GiB automatic memory ceiling and
      # drops this four-core runner to three compression threads.
      XZ_COMPRESS_MEMLIMIT: 8GiB

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          free_gb() { df -B1G --output=avail / | tail -n1 | tr -d ' '; }
          echo "Initial disk space:"
          df -h / /mnt 2>/dev/null || df -h /
          if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
            echo "Removing preinstalled toolchains to make room"
            sudo rm -rf \
              /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
              /usr/local/share/powershell /usr/local/share/chromium \
              /usr/lib/jvm /opt/microsoft /opt/google /opt/az
            docker system prune --all --force >/dev/null
            echo "After cleanup:"
            df -h / /mnt 2>/dev/null || df -h /
          else
            echo "Cleanup not needed: $(free_gb) GiB free, need $MIN_FREE_GB GiB"
          fi
          echo "CPUs: $(nproc)"; free -h
          if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
            echo "::error::only $(free_gb) GiB free on /, need $MIN_FREE_GB GiB"
            exit 1
          fi

      - name: Start disk sampler
        run: |
          # shellcheck disable=SC2016 # the inner bash expands these
          nohup bash -c 'while true; do
            echo "$(date -u +%H:%M:%S) $(df -B1M --output=avail / | tail -n1 | tr -d " ")"
            sleep 20
          done' > "$RUNNER_TEMP/disk-free-mb.log" 2>&1 &

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl dosfstools e2fsprogs mount util-linux \
            xz-utils zerofree zstd

      - name: Download kernel
        uses: actions/download-artifact@v6
        with:
          name: linux-ps5-k73
          path: ${{ env.KERNEL_DIR }}

      - name: Check kernel download
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          test -s kernel-cache-manifest.sha256
          unexpected=$(find "$PACKAGE" "$PACKAGE.sha256" kernel ps5-iw620 \
            kernel-cache-manifest.sha256 ! -type d ! -type f -print)
          if [ -n "$unexpected" ]; then
            echo "::error::kernel bundle has a symlink or special file"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          sha256sum -c kernel-cache-manifest.sha256
          sha256sum -c "$PACKAGE.sha256"
          (cd ps5-iw620 && sha256sum -c SHA256SUMS)
          ls -lR

      - name: Build image
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          df -h /
          base_args=()
          if [ -n "${BASE_URL_INPUT:-}" ]; then
            base_args=(--base-url "$BASE_URL_INPUT")
          fi
          sudo ./scripts/build-cachyos1160-k73-image.sh --kernel-dir "$KERNEL_DIR" \
            "${base_args[@]}" --output "$IMAGE"
          # The base download and manifests are no longer needed.
          sudo rm -rf work/cachyos1160-k73
          df -h /

      - name: Zero free blocks in the root filesystem
        run: |
          set -euo pipefail
          # Unused ext4 blocks still hold old data from the base image,
          # including the replaced 7.1.7 kernel modules, and xz has to
          # compress that too. Zeroing them makes the .img.xz smaller, so it
          # stays under 2 GiB as one file. The FAT boot partition is not
          # touched.
          loop=$(sudo losetup --find --show --partscan "$IMAGE")
          trap 'sudo losetup -d "$loop"' EXIT
          sudo udevadm settle

          # Find the root by its filesystem type, not by partition number.
          root=
          for nr in $(sudo partx --noheadings --output NR "$loop"); do
            part=${loop}p$nr
            if [ ! -b "$part" ]; then
              echo "::error::$part did not appear after losetup --partscan"
              exit 1
            fi
            fstype=$(sudo blkid -p -o value -s TYPE "$part" || true)
            echo "partition $nr: ${fstype:-no filesystem}"
            if [ "$fstype" = ext4 ]; then
              if [ -n "$root" ]; then
                echo "::error::more than one ext4 partition in the image"
                exit 1
              fi
              root=$part
            fi
          done
          if [ -z "$root" ]; then
            echo "::error::no ext4 partition in the image"
            exit 1
          fi
          echo "Root filesystem: $root"

          if ! sudo e2fsck -fn "$root"; then
            echo "::error::the root filesystem is not clean, not zeroing it"
            exit 1
          fi
          # zerofree -v prints a progress counter, dropped here, and then the
          # zeroed/free/total block counts.
          sudo zerofree -v "$root" 2>&1 | tr '\r' '\n' | grep -v '%$'
          sudo e2fsck -fn "$root"

      - name: Verify image
        run: sudo ./scripts/verify-cachyos1160-k73-image.sh --image "$IMAGE" --kernel-dir "$KERNEL_DIR"

      - name: Record boot files
        run: |
          set -euo pipefail
          # Partition 2 is the FAT boot partition.
          read -r start sectors < <(
            partx --noheadings --output START,SECTORS --nr 2 "$IMAGE")
          boot=$(mktemp -d)
          sudo mount -t vfat \
            -o "ro,loop,offset=$((start * 512)),sizelimit=$((sectors * 512))" \
            "$IMAGE" "$boot"
          trap 'sudo umount "$boot"' EXIT
          mkdir -p "$DIST"
          (cd "$boot" && sha256sum bzImage initrd.img cmdline.txt vram.txt kexec.sh) \
            > "$DIST/boot-files.sha256"
          (cd "$boot" && stat -c '%-12n %10s bytes' bzImage initrd.img cmdline.txt vram.txt kexec.sh) \
            > "$DIST/boot-files.sizes"
          ./distros/cachyos1160-k73/files/ps5-1160-check-boot-files \
            "$boot/bzImage" "$boot/initrd.img" "$boot/cmdline.txt" |
            sed "s#$boot/##" > "$DIST/boot-files.check"
          cat "$DIST/boot-files.sha256" "$DIST/boot-files.sizes" "$DIST/boot-files.check"

      - name: Compress
        run: |
          set -euo pipefail
          # Each GitHub release file must be under 2 GiB. The image is not split.
          limit=2147483648
          raw_sha=$(sha256sum "$IMAGE" | awk '{print $1}')
          xz -T0 -9 --memlimit-compress="$XZ_COMPRESS_MEMLIMIT" -c "$IMAGE" \
            > "$DIST/ps5-cachyos1160-k73.img.xz"
          cp "$OUT/cachyos1160-k73-root-changes.txt" "$DIST/"

          cd "$DIST"
          xz_size=$(stat -c %s ps5-cachyos1160-k73.img.xz)
          echo "ps5-cachyos1160-k73.img.xz: $xz_size bytes (limit: under $limit)"
          if [ "$xz_size" -ge "$limit" ]; then
            echo "::error::ps5-cachyos1160-k73.img.xz is $xz_size bytes, over GitHub's 2 GiB per-file limit (release files must be under $limit bytes). The image must be made smaller; it is not split, and no release was created."
            exit 1
          fi
          # The upload must decompress to the image that was checked.
          roundtrip_sha=$(xz -T0 -dc ps5-cachyos1160-k73.img.xz | sha256sum | awk '{print $1}')
          if [ "$roundtrip_sha" != "$raw_sha" ]; then
            echo "::error::decompressed ps5-cachyos1160-k73.img.xz does not match the raw image"
            exit 1
          fi

          {
            echo "$raw_sha  ps5-cachyos1160-k73.img"
            sha256sum ps5-cachyos1160-k73.img.xz cachyos1160-k73-root-changes.txt
          } > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Write build info
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          base_xz_sha=$(sed -n 's/^BASE_XZ_SHA256=//p' scripts/build-cachyos1160-k73-image.sh)
          changes=$OUT/cachyos1160-k73-root-changes.txt
          n_changes=$(grep -vc '^#' "$changes")
          swap=$(sed -n '2s/^# //p' "$OUT/cachyos1160-k73-kernel-swap.txt")
          min_free=$(awk '{print $2}' "$RUNNER_TEMP/disk-free-mb.log" | sort -n | head -n1)
          {
            echo "PS5 CachyOS 7.3.0 image, firmware 11.60"
            echo
            echo "Commit:      $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "Build run:   $RUN_URL"
            echo "Finished:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Base image:  ps5-cachyos.img.xz, sha256 $base_xz_sha"
            echo "             (ps5-linux/ps5-linux-image release built 2026-08-29 from 52db0a4)"
            echo "Raw image:   $(stat -c %s "$IMAGE") bytes"
            echo "Fan policy:  ICC autoservo target 65 C with immediate readback"
            echo "Root changes: $n_changes paths outside the kernel package, listed in cachyos1160-k73-root-changes.txt"
            echo "Kernel swap: $swap"
            echo "Lowest free disk on / during the build: ${min_free} MiB"
            echo
            cat "$KERNEL_DIR/kernel/kernel-build-info.txt"
            echo
            echo "Kernel package:"
            cat "$KERNEL_DIR/$PACKAGE.sha256"
            echo
            echo "IW620 Wi-Fi modules (installed under /usr/lib/modules/7.3.0/updates/ps5-iw620):"
            cat "$KERNEL_DIR/ps5-iw620/SHA256SUMS"
            echo
            echo "FAT boot partition files:"
            cat "$DIST/boot-files.sha256"
            cat "$DIST/boot-files.sizes"
            echo
            echo "Bounded 11.60 loader check:"
            cat "$DIST/boot-files.check"
            echo
            echo "Release files:"
            cat "$DIST/SHA256SUMS"
          } > "$DIST/build-info.txt"
          cat "$DIST/build-info.txt"
          { echo '```'; cat "$DIST/build-info.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cachyos1160-k73-checksums
          path: |
            dist/SHA256SUMS
            dist/boot-files.sha256
            dist/boot-files.check
            dist/build-info.txt
            output/cachyos1160-k73-root-changes.txt
            output/cachyos1160-k73-kernel-swap.txt
            output/cachyos1160-k73-boot-files.txt
          if-no-files-found: ignore

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || format('cachyos1160-k73-build-{0}', github.run_number) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::invalid release tag: $TAG"
            exit 1
          fi
          cd "$DIST"

          cat > release-notes.md <<EOF
          **Unified CachyOS 7.3 tester candidate for retail PS5 firmware 11.60 only. This exact CI-built image has not been booted on hardware.** It contains both the proven IW620 path and experimental MediaTek MT7921 support, but Image 3's hardware result does not transfer to this new kernel or image. Read the [source-matched CachyOS 7.3 profile notes](https://github.com/gzimbric/ps5-linux-image/blob/${GITHUB_SHA}/distros/cachyos1160-k73/README.md), follow the [Image 4 tester guide](https://github.com/gzimbric/ps5-linux-porting/blob/main/docs/cachyos1160-k73-image-4-tester-guide.md), and use the [matching bounded loader prerelease](https://github.com/gzimbric/ps5-linux-loader/releases/tag/firmware-11.60-dma-e820-bounded-run21). Fully power off instead of using Linux sleep or Rest Mode between attempts.

          This build was produced from ${GITHUB_SHA:0:7} by [this run]($RUN_URL). Publishing it for testing proves only that the hosted build and structural checks passed; it is not evidence of a console boot.

          ### What's in this build

          - The \`linux-ps5 7.3.0-5\` package uses mainline Linux 7.3 with rmux's published 7.3 PS5 patch set ([rmuxnet/ps5-linux-patches-1](https://github.com/rmuxnet/ps5-linux-patches-1) at \`36f173f\`). After it, the build applies the exact \`ps5-btusb-quirks-fix.patch\` asset from [VivaLaVent's Bazzite Deck v1.0.3](https://github.com/VivaLaVent/ps5-bazzite-deck/releases/tag/v1.0.3), pinned at SHA-256 \`c01bdcc134f25a86825f2824d12a82da02db18e7b1940db722223b0c4611eed8\`. It is rebuilt into this kernel; do not copy a prebuilt \`btusb.ko\` from Bazzite or another image. Bazzite reports successful DualSense pairing on Linux 7.3 and firmware 13.60. That supports the source choice but is not an 11.60 result for this image.
          - \`ps5fan.service\` leaves the ICC's automatic thermal controller active, sets a 65 C target before the performance policy starts and fails on a readback mismatch. The tested CFI-1115B is recognized as B-Eiger/Denali with Hynix 1x memory. A bounded 20 C diagnostic demand made its fan clearly audible and reduced Tctl from 35.75 C to about 33 C in 28 seconds. Linux still exposes no chassis-fan RPM/tachometer value. Edit \`PS5_FAN_TARGET_C\` in \`/etc/default/ps5-fan\` within 40-80 C and restart the service to change the target; lower values cool more aggressively.
          - \`ps5-performance.service\` starts by default after the fan request. It verifies amdgpu still has \`dpm=0\`, loads \`ps5_gpufreq\` before \`ps5_cpufreq\`, selects GPU \`simple_ondemand\` and CPU \`schedutil\`, and keeps CPU boost off. Automatic startup and a short bounded CPU load passed on the exact public Image 3 artifact; bounded GPU load and longer stability testing remain open, and that result does not transfer to this new image. To skip it on the next cold boot, create an empty \`/boot/efi/disable-ps5-performance\` file and fully power off. Do not use \`rmmod\` as a rollback because unloading does not restore the clocks.
          - The first session opens the CachyOS Plasma desktop so networking can be configured before Steam needs it. Gaming Mode launches Steam with \`-steamos -gamepadui\`; Steam's own legacy desktop-switch path calls \`steamos-session-select\`, with no custom SteamOSManager service or D-Bus shim. Returning to Gaming Mode stops Plasma's graphical session target before Gamescope starts, and the selector also keeps a \`plasmax11\` escape hatch. The complete Gaming → Desktop → Gaming round trip passed on the local Run 21 console. **Switch to Desktop is not instant:** a clean pass took about 2.4 seconds and an earlier cleanup-heavy transition took about 27 seconds, so wait before clicking again or power-cycling. Linux sleep, suspend, hibernate, hybrid sleep and suspend-then-hibernate are masked; use a full shutdown between Linux boots.
          - The kernel enables amdgpu's VCN video block. The exact public Image 3 artifact brought up the display with VCN enabled, but this new CI image remains unbooted; see "If there is no picture" below. Its firmware, \`ps5_vcn.bin\` from AMD, is built into the kernel; the licence is in \`/usr/share/licenses/linux-ps5/LICENSE.amdgpu\`.
          - The onboard IW620 Wi-Fi driver is updated to \`ps5-linux/ps5-linux-mwifiex\` commit \`4bce848\`, including its HE and transmit-path fixes, with the Linux 7.3 compatibility follow-up. NetworkManager disables scan-time MAC randomization and Wi-Fi power saving and keeps the adapter's permanent MAC; Plasma Wi-Fi passed on the exact public Image 3 artifact. The image still contains no IW620 firmware: the bounded Wi-Fi loader writes this console's own firmware to \`lib/nxp/\` on the boot partition, and the boot service copies it before loading the driver. Never upload or redistribute \`lib/nxp/pcieuartiw620_combo_v1.bin\` or \`/lib/firmware/nxp/pcieuartiw620_combo_v1.bin\`.
          - Consoles with the alternate MediaTek PCI Wi-Fi hardware can use Linux 7.3's in-tree \`mt7921e\` driver in this same image. It is selected only by its MediaTek PCI aliases, uses the eight firmware files already supplied by CachyOS, and gets \`disable_aspm=1\`, matching the only runtime option installed by [j4lenj's Linux 7.1.7 reference](https://github.com/j4lenj/ps5-mt7921-wifi). This build does not copy that repository's old source or binaries, does not force-load \`mt7921e\`, and leaves the exact-ID-gated IW620 path unchanged. The known PS5 MediaTek device ID is \`14c3:7961\`; the other aliases are upstream driver coverage. MediaTek Wi-Fi is not yet validated on firmware 11.60, and this change makes no claim about MediaTek Bluetooth.
          - A live-tested PolicyKit rule prevents Plasma's NetworkManager prompt from getting stuck after a Gaming Mode → desktop handoff. It applies only to the dedicated \`steam\` user and only to the nine ordinary desktop actions for network and Wi-Fi enablement, connection control, own/system profile changes, Wi-Fi scan/share and connectivity checks. It does not grant NetworkManager reload, hostname, global-DNS, WWAN, sleep, checkpoint or statistics actions.
          - The base image's redundant \`systemd-networkd-wait-online.service\` is masked before first boot, preventing the vendor preset from enabling it alongside NetworkManager. The exact public Image 3 hardware run used NetworkManager successfully but the networkd wait unit still timed out after two minutes and became the only failed unit; disabling and then masking that wait unit live left NetworkManager active, SSH connected and no failed units.
          - The boot report (\`ps5-boot-report.txt\` on the boot partition) records Bluetooth controller and module identity, temperatures, CPU/GPU clocks, the performance opt-out, session state and sleep masks. It replaces Wi-Fi network names with \`<wifi-name>\` and masks MAC addresses, but still contains IP addresses. Review and redact it and any \`dmesg\` output before posting; do not upload raw firmware, keys, the FAT partition, or unsanitized logs.
          - pacman holds \`linux-ps5\` back from updates. After a kernel or initramfs change, which an ordinary \`pacman -Syu\` can also make, a pacman hook builds a new initramfs, checks it, and updates \`bzImage\` and \`initrd.img\` on the boot partition if they pass the loader's checks. The pair it replaces is kept there as \`bzImage.prev\` and \`initrd.img.prev\`. pacman refuses a kernel change while the boot partition is not mounted read-write.

          Thanks to rmux (Armandas Kvietkus) for the 7.3 port and the frequency drivers.

          ### Loader

          This image needs the [bounded 11.60 loader tester prerelease](https://github.com/gzimbric/ps5-linux-loader/releases/tag/firmware-11.60-dma-e820-bounded-run21), which is not part of this image release. Use the bounded Wi-Fi ELF on an IW620 console so the loader can supply that console's firmware. Use the bounded non-Wi-Fi ELF on a MediaTek console; \`mt7921e\` uses firmware already packaged in the image. The exact Run 21 artifacts were built at \`98925a2\`; current loader \`main\` reproduces their hashes and adds direct-target and CI safeguards:

          - \`make linux-1160-dma-e820-bounded-wifi\` for Wi-Fi, ELF sha256 \`e9fe6469943e97a635eccd3f674e55876b56cd1bbd69023eee3af4acea3a1b5f\`
          - \`make linux-1160-dma-e820-bounded\` without Wi-Fi, ELF sha256 \`1c80b040c5a808b3f09418728424a875d5598fe6b2a5d68adeb4db5979a7541a\`

          The bounded Wi-Fi build (sha256 \`e9fe6469...\`) booted the exact public Image 3 artifact and supplied the console's IW620 firmware. The bounded non-Wi-Fi build and this CI image remain unbooted. Every earlier 11.60 loader refuses this image, because \`bzImage\` and \`initrd.img\` are no longer the exact sizes those loaders accept. That includes the published DMA loader and \`linux-1160-dma-e820-wifi\`, which is not the bounded Wi-Fi build despite the similar name. Don't add \`nokaslr\`, \`mem=\` or \`memmap=\` to \`cmdline.txt\`; the bounded loader refuses them.

          ### Login

          Login is \`steam\` / \`steam\`, and SSH accepts that password. The \`steam\` account has passwordless sudo, and the first-boot setup screen is skipped, so nothing prompts you to change it. Run \`passwd\` after the first boot, and keep the console on a trusted network until you do.

          The first session opens the Plasma desktop. Configure networking there, then use the desktop shortcut to enter Gaming Mode. Steam can take a minute or two to update the first time it starts.

          ### If there is no picture

          The exact public Image 3 artifact brought up HDMI with VCN enabled, but video decode was not tested and this new CI-built image is still unbooted. If VCN fails, amdgpu can fail to start. Ethernet and SSH should still come up, since the root filesystem does not depend on amdgpu. SSH in and send the output of \`sudo dmesg\` along with \`ps5-boot-report.txt\` from the boot partition. To try a boot without VCN, find the line \`detected ip block number N <vcn_v2_0_0>\` in either of them and add \`amdgpu.ip_block_mask=\` to the end of the line in \`cmdline.txt\`, set to 0xffffffff with bit N cleared (for N = 6 that is \`amdgpu.ip_block_mask=0xffffffbf\`). Leave \`nokaslr\` out.

          ### Download and flash

          **Flashing destroys every partition and file on the selected target drive. Verify the device path and disconnect unrelated removable drives first.** Download \`ps5-cachyos1160-k73.img.xz\` and \`SHA256SUMS\` into one folder, then on Linux:

          \`\`\`
          sha256sum -c --ignore-missing SHA256SUMS
          xz -dc ps5-cachyos1160-k73.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`

          On macOS use \`shasum -a 256 -c --ignore-missing SHA256SUMS\`. balenaEtcher and Raspberry Pi Imager can flash the \`.img.xz\` directly.

          The image is 12,582,912,000 bytes and fits a 16 GB USB drive. The root partition grows to fill the drive on first boot.

          ### Checksums

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`

          FAT boot partition files:

          \`\`\`
          $(cat boot-files.sha256)
          $(cat boot-files.sizes)
          \`\`\`
          EOF

          title="CachyOS 7.3.0 for PS5 firmware 11.60 ($TAG)"
          assets=(ps5-cachyos1160-k73.img.xz SHA256SUMS build-info.txt \
            cachyos1160-k73-root-changes.txt)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::release $TAG already exists and is not a draft"
              exit 1
            fi
            # A rerun for the same tester build replaces the obsolete draft in
            # place, keeping one release rather than creating split downloads.
            gh release edit "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
            url=$(gh release view "$TAG" --json url --jq .url)
          else
            url=$(gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md "${assets[@]}")
          fi
          echo "Draft release: $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # The image only exists on this runner. If the draft could not be made,
      # keep what it would have held, so it can be made by hand.
      - name: Keep the release files
        if: failure() && steps.release.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: cachyos1160-k73-release-files
          path: |
            dist/ps5-cachyos1160-k73.img.xz
            dist/SHA256SUMS
            dist/build-info.txt
            dist/cachyos1160-k73-root-changes.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Say how to finish the release
        if: failure() && steps.release.outcome == 'failure'
        env:
          TAG: ${{ inputs.release_tag || format('cachyos1160-k73-build-{0}', github.run_number) }}
        run: |
          {
            echo "Creating the draft release failed. The release files are in the"
            echo "cachyos1160-k73-release-files artifact for 7 days. To finish it:"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n cachyos1160-k73-release-files -D release-files"
            echo "cd release-files && sha256sum -c --ignore-missing SHA256SUMS"
            echo "gh release create $TAG -R $GITHUB_REPOSITORY --draft --prerelease --target $GITHUB_SHA \\"
            echo "  --title 'CachyOS 7.3.0 for PS5 firmware 11.60 ($TAG)' --notes-file release-notes.md \\"
            echo "  ps5-cachyos1160-k73.img.xz SHA256SUMS build-info.txt cachyos1160-k73-root-changes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
