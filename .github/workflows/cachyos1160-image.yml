name: CachyOS 11.60 image
run-name: CachyOS 11.60 image (${{ github.ref_name }})

# Builds the public CachyOS image for PS5 firmware 11.60 on a GitHub-hosted
# x86_64 runner. The build script starts from the official ps5-cachyos.img.xz,
# applies the distros/cachyos1160 profile, and stops on any mismatch. This
# workflow then checks the pinned FAT boot files again and attaches the
# xz-compressed image to a draft release. Nothing is public until the draft
# is reviewed and published by hand.
#
# Release assets are capped at 2 GiB, so the .img.xz is split into numbered
# parts. Release assets are used rather than workflow artifacts because
# artifacts need a GitHub login to download and expire after 90 days at most.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the draft release (created when the draft is published). Default: cachyos1160-build-<run number>'
        type: string
        default: ''
      base_url:
        description: 'Download the official ps5-cachyos.img.xz from this URL instead of the upstream default. It must still match the pinned SHA-256.'
        type: string
        default: ''
  push:
    tags:
      - 'cachyos1160-image-*'

permissions:
  contents: write

concurrency:
  group: cachyos1160-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: output/ps5-cachyos1160.img
      CHANGES: output/cachyos1160-root-changes.txt
      DIST: dist
      # Leave room for the base download, the raw image and the compressed
      # parts.
      MIN_FREE_GB: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az
          docker system prune --all --force >/dev/null
          echo "After cleanup:"
          df -h / /mnt 2>/dev/null || df -h /
          echo "CPUs: $(nproc)"; free -h
          free_gb=$(df -B1G --output=avail / | tail -n1 | tr -d ' ')
          if [ "$free_gb" -lt "$MIN_FREE_GB" ]; then
            echo "::error::only ${free_gb} GB free on /, need ${MIN_FREE_GB} GB"
            exit 1
          fi

      - name: Start disk sampler
        run: |
          nohup bash -c 'while true; do
            echo "$(date -u +%H:%M:%S) $(df -B1M --output=avail / | tail -n1 | tr -d " ")"
            sleep 20
          done' > "$RUNNER_TEMP/disk-free-mb.log" 2>&1 &

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl dosfstools e2fsprogs gcc libc6-dev mount util-linux \
            xz-utils zstd

      - name: Build image
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          df -h /
          base_args=()
          if [ -n "${BASE_URL_INPUT:-}" ]; then
            base_args=(--base-url "$BASE_URL_INPUT")
          fi
          sudo ./scripts/build-cachyos1160-image.sh "${base_args[@]}" --output "$IMAGE"
          # The base download and manifests are no longer needed.
          sudo rm -rf work/cachyos1160
          df -h /

      - name: Check pinned boot files
        run: |
          set -euo pipefail
          test "$(stat -c %s "$IMAGE")" = 12582912000

          # Partition 2 is the FAT boot partition.
          read -r start sectors < <(
            partx --noheadings --output START,SECTORS --nr 2 "$IMAGE")
          boot=$(mktemp -d)
          sudo mount -t vfat \
            -o "ro,loop,offset=$((start * 512)),sizelimit=$((sectors * 512))" \
            "$IMAGE" "$boot"
          trap 'sudo umount "$boot"' EXIT

          failed=0
          check() {
            local name=$1 size=$2 hash=$3 actual_size actual_hash
            actual_size=$(stat -c %s "$boot/$name")
            actual_hash=$(sha256sum "$boot/$name" | awk '{print $1}')
            printf '%-12s %10s  %s\n' "$name" "$actual_size" "$actual_hash"
            if [ "$actual_size" != "$size" ]; then
              echo "::error::$name is $actual_size bytes, expected $size"
              failed=1
            fi
            if [ "$actual_hash" != "$hash" ]; then
              echo "::error::$name SHA-256 is $actual_hash, expected $hash"
              failed=1
            fi
          }
          check bzImage     12702720 11280a8f5ca197ee5458fd446a4dadf2d0b5d0ef6218583cbe6325ee34e99cde
          check initrd.img  54376639 c37b88569ef8f05b0b4ae432a8ec0fd323b7a3537a6441f8c45baaad45ff061f
          check cmdline.txt 118      aec7a85e9ebcf36e4bdaeb89242b898e17817acd40c16db57a3bb9c3117b1da8
          check vram.txt    11       bc4642feb06a4cc6d10d5865e321efaad7ab3f3f1d5d025151b79978164310a0
          check kexec.sh    136      0f26e09911a8a2bc9912d7c77fee6ac09ccd18a820086cb103be92de081b6c52

          listing=$(cd "$boot" && find . -mindepth 1 -printf '%P\n' | sort | tr '\n' ' ')
          if [ "$listing" != "bzImage cmdline.txt initrd.img kexec.sh vram.txt " ]; then
            echo "::error::unexpected files on the FAT partition: $listing"
            failed=1
          fi
          [ "$failed" -eq 0 ]

          mkdir -p "$DIST"
          (cd "$boot" && sha256sum bzImage initrd.img cmdline.txt vram.txt kexec.sh) \
            > "$DIST/boot-files.sha256"

      - name: Compress and split
        run: |
          set -euo pipefail
          raw_sha=$(sha256sum "$IMAGE" | awk '{print $1}')
          xz -T0 -6 -c "$IMAGE" \
            | split --bytes=1900M --numeric-suffixes=1 --suffix-length=3 \
                - "$DIST/ps5-cachyos1160.img.xz."
          cp "$CHANGES" "$DIST/"

          cd "$DIST"
          parts=(ps5-cachyos1160.img.xz.[0-9][0-9][0-9])
          xz_sha=$(cat "${parts[@]}" | sha256sum | awk '{print $1}')
          # The joined parts must decompress to the image that was checked.
          roundtrip_sha=$(cat "${parts[@]}" | xz -T0 -dc | sha256sum | awk '{print $1}')
          if [ "$roundtrip_sha" != "$raw_sha" ]; then
            echo "::error::decompressed parts do not match the raw image"
            exit 1
          fi

          {
            echo "$raw_sha  ps5-cachyos1160.img"
            echo "$xz_sha  ps5-cachyos1160.img.xz"
            sha256sum "${parts[@]}" cachyos1160-root-changes.txt
          } > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Write build info
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          base_xz_sha=$(sed -n 's/^BASE_XZ_SHA256=//p' scripts/build-cachyos1160-image.sh)
          fan=$(awk '$2 == "usr/local/sbin/ps5_fan_max" { print $7 " bytes, sha256 " $8 }' "$CHANGES")
          n_changes=$(grep -vc '^#' "$CHANGES")
          min_free=$(awk '{print $2}' "$RUNNER_TEMP/disk-free-mb.log" | sort -n | head -n1)
          {
            echo "PS5 CachyOS image, firmware 11.60"
            echo
            echo "Commit:      $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "Build run:   $RUN_URL"
            echo "Finished:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Base image:  ps5-cachyos.img.xz, sha256 $base_xz_sha"
            echo "             (ps5-linux/ps5-linux-image release built 2026-08-29 from 52db0a4)"
            echo "Raw image:   $(stat -c %s "$IMAGE") bytes"
            echo "Fan helper:  ps5_fan_max, $fan (gcc $(gcc -dumpfullversion))"
            echo "Root changes: $n_changes paths, listed in cachyos1160-root-changes.txt"
            echo "Lowest free disk on / during the build: ${min_free} MiB"
            echo
            echo "FAT boot partition files:"
            cat "$DIST/boot-files.sha256"
            echo
            echo "Release files:"
            cat "$DIST/SHA256SUMS"
          } > "$DIST/build-info.txt"
          cat "$DIST/build-info.txt"
          { echo '```'; cat "$DIST/build-info.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cachyos1160-checksums
          path: |
            dist/SHA256SUMS
            dist/boot-files.sha256
            dist/build-info.txt
            dist/cachyos1160-root-changes.txt
          if-no-files-found: ignore

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || format('cachyos1160-build-{0}', github.run_number) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::invalid release tag: $TAG"
            exit 1
          fi
          cd "$DIST"
          parts=(ps5-cachyos1160.img.xz.[0-9][0-9][0-9])
          joined=$(printf '%s + ' "${parts[@]}")
          joined=${joined% + }

          cat > release-notes.md <<EOF
          Test build of CachyOS for PS5 firmware 11.60, built from ${GITHUB_SHA:0:7} by [this run]($RUN_URL).

          This is the official \`ps5-cachyos\` image (release built 2026-08-29 from upstream commit 52db0a4) with the 11.60 boot files and the root changes listed in \`cachyos1160-root-changes.txt\`. The five FAT boot files match, byte for byte, the set that booted to Steam Gaming Mode and KDE Plasma on an 11.60 console. This build itself has not been booted on hardware yet.

          The firmware 11.60 loader is not part of this release. Use the loader build you were given for testing.

          Login is \`steam\` / \`steam\`, and SSH accepts that password. The \`steam\` account has passwordless sudo, and the first-boot setup screen is skipped, so nothing prompts you to change it. Run \`passwd\` after the first boot, and keep the console on a trusted network until you do.

          Use wired Ethernet. Wi-Fi is off by default: the onboard IW620 driver is blacklisted and its firmware is not included. The porting repository's [Wi-Fi guide](https://github.com/gzimbric/ps5-linux-porting/blob/main/docs/ubuntu2404-wifi.md) covers the driver and firmware; it was written for the Ubuntu image.

          The first boot can sit on a text console for a minute or two while Steam updates itself. Gaming Mode starts after that.

          ### Download and flash

          Download the ${#parts[@]} \`ps5-cachyos1160.img.xz.NNN\` parts and \`SHA256SUMS\` into one folder, then on Linux:

          \`\`\`
          sha256sum -c --ignore-missing SHA256SUMS
          cat ps5-cachyos1160.img.xz.[0-9][0-9][0-9] > ps5-cachyos1160.img.xz
          sha256sum -c --ignore-missing SHA256SUMS
          xz -dc ps5-cachyos1160.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`

          On macOS use \`shasum -a 256 -c --ignore-missing SHA256SUMS\`. On Windows join the parts with \`copy /b $joined ps5-cachyos1160.img.xz\`. balenaEtcher and Raspberry Pi Imager can flash the joined \`.img.xz\` directly.

          The image is 12,582,912,000 bytes and fits a 16 GB USB drive. The root partition grows to fill the drive on first boot.

          ### Checksums

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`

          FAT boot partition files:

          \`\`\`
          $(cat boot-files.sha256)
          \`\`\`
          EOF

          url=$(gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "CachyOS for PS5 firmware 11.60 ($TAG)" \
            --notes-file release-notes.md \
            "${parts[@]}" SHA256SUMS build-info.txt cachyos1160-root-changes.txt)
          echo "Draft release: $url" | tee -a "$GITHUB_STEP_SUMMARY"
